name: Release Desktop Installers

# 推送 v* 版本 tag 触发：三端四架构打包（mac arm64/x64、win x64、linux x64），
# 汇总产物并按历史 Commit 生成 Notes（Features/BugFix/Optimize）发布 GitHub Release。
# Mac 无证书模式：bundle 会自动注入 DMG「清除隔离标记」辅助脚本（specs/desktop/dmg-installer.md）。
# relay job 同时打包手机远控中转服务两种部署产物（服务器直连 / Cloudflare 边缘，spec §20）并入 Release。
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  build:
    name: bundle ${{ matrix.target }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-latest
            target: mac
            arch: arm64
          - runner: macos-latest
            target: mac
            arch: x64
          - runner: windows-latest
            target: win
            arch: x64
          - runner: ubuntu-latest
            target: linux
            arch: x64
    env:
      # 正式包身份（production flavor）；跳过开发态 mock-cdn 离线缓存，打包态不依赖。
      ZCODE_ENV: production
      ZCODE_SKIP_REMOTE_ASSETS: "1"
      HUSKY: "0"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install Linux packaging tools
        # rpm/deb/pacman 目标依赖 rpmbuild、zstd 与 bsdtar（libarchive-tools）。
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm zstd libarchive-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Bundle desktop installers
        run: pnpm bundle:desktop -- --os ${{ matrix.target }} --arch ${{ matrix.arch }}

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}-${{ matrix.arch }}
          # 只上传安装包本体；blockmap 已随无证书注入删除或随更新屏蔽无消费方，unpacked 目录不分发。
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/*.pkg.tar.zst
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/latest*.yml
          if-no-files-found: error
          retention-days: 7

  relay:
    name: package relay deploy kits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: "0"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build relay bundle
        run: pnpm --filter @zcode/relay-server run build:bundle

      - name: Build phone UI (Pages, domain-agnostic)
        # 不注入 VITE_ZCODE_WEB_REMOTE_CONTROL_RELAY_WS_URL：运行时经票据 ws 参数定位 relay（spec §5.3）。
        run: pnpm --filter @zcode/web run build:remote-pages

      - name: Assemble server-mode kit
        run: |
          root=packages/relay-server
          stage=relay-artifacts/server
          mkdir -p "$stage/docs"
          cp "$root/dist/relay.cjs" "$stage/"
          cp "$root/deploy/relay.env.direct.example" "$stage/relay.env.example"
          cp "$root/deploy/mikiko-relay.service" "$root/deploy/Caddyfile.example" "$stage/"
          cp "$root/docs/deploy-server.md" "$stage/docs/"
          cp -R packages/web/dist-pages "$stage/web"

      - name: Assemble cloudflare-mode kit
        run: |
          root=packages/relay-server
          stage=relay-artifacts/cloudflare
          mkdir -p "$stage/docs"
          cp "$root/dist/relay.cjs" "$stage/"
          cp "$root/deploy/relay.env.cloudflare.example" "$stage/relay.env.example"
          cp "$root/deploy/mikiko-relay.service" "$root/deploy/mikiko-tunnel.service" "$stage/"
          cp "$root/deploy/deploy-pages.sh" "$stage/"
          cp "$root/docs/deploy-cloudflare.md" "$stage/docs/"
          cp -R packages/web/dist-pages "$stage/web"

      - name: Upload server-mode kit
        uses: actions/upload-artifact@v4
        with:
          name: relay-server-deploy
          path: relay-artifacts/server/
          if-no-files-found: error
          retention-days: 7

      - name: Upload cloudflare-mode kit
        uses: actions/upload-artifact@v4
        with:
          name: relay-cloudflare-deploy
          path: relay-artifacts/cloudflare/
          if-no-files-found: error
          retention-days: 7

  release:
    name: publish release
    needs: [build, relay]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out (full history for release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: installers-*
          merge-multiple: true

      - name: Download relay deploy kits
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: relay-*-deploy
          merge-multiple: false

      - name: Zip relay deploy kits
        # 目录形态产物先打包成 zip 再挂到 Release，下载即用（与部署文档的 unzip 步骤对应）。
        run: |
          cd artifacts
          for dir in relay-server-deploy relay-cloudflare-deploy; do
            if [ -d "$dir" ]; then
              zip -r "$dir.zip" "$dir"
              rm -rf "$dir"
            fi
          done

      - name: Generate release notes
        run: |
          node .github/scripts/generate-release-notes.mjs "${GITHUB_REF_NAME}" > release-notes.md
          cat release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # 重打 tag 重发时先清掉旧 Release 与资产（tag 保留，指向本次触发提交），保证发布内容幂等。
          if gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1; then
            echo "删除已存在的 Release ${GITHUB_REF_NAME}，重新发布"
            gh release delete "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" --yes
          fi
          gh release create "${GITHUB_REF_NAME}" \
            --repo "${GITHUB_REPOSITORY}" \
            --title "${GITHUB_REF_NAME#v}" \
            --notes-file release-notes.md \
            artifacts/*

  publish-update-feed:
    name: publish update feed (R2)
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0

      - name: Download installers
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          pattern: installers-*
          merge-multiple: true

      - name: Publish manifests and installers
        env:
          UPDATE_PUBLISH_TOKEN: ${{ secrets.UPDATE_PUBLISH_TOKEN }}
        run: |
          if [ -z "$UPDATE_PUBLISH_TOKEN" ]; then
            echo "::notice::secrets.UPDATE_PUBLISH_TOKEN 未配置，跳过升级 feed 发布（版本仍可在 GitHub Release 下载）"
            exit 78
          fi
          mkdir -p packages/desktop/dist
          cp artifacts/* packages/desktop/dist/ 2>/dev/null || true
          node scripts/publish-update-feed.mjs \
            --dist packages/desktop/dist --version "${GITHUB_REF_NAME#v}" --channel stable
