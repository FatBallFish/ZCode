name: Release Desktop Installers

# 推送 v* 版本 tag 触发：三端四架构打包（mac arm64/x64、win x64、linux x64），
# 汇总产物并按历史 Commit 生成 Notes（Features/BugFix/Optimize）发布 GitHub Release。
# Mac 正式签名&公证：配置 secrets.MAC_SIGNING_P12_BASE64 /
#   MAC_SIGNING_P12_PASSWORD / MAC_SIGNING_IDENTITY 后自动启用 Developer ID 签名，
#   build 先归档签名原包；独立 notarize job 保存提交ID、限时等待、staple并验收。
#   source-run-id 可复用原始包和提交ID，跳过全部编译；见 docs/desktop/release-recovery.md。
#   公证凭据三选一：APPLE_ID+APPLE_APP_SPECIFIC_PASSWORD+APPLE_TEAM_ID 或
#   APPLE_API_KEY_BASE64+APPLE_API_KEY_ID+APPLE_API_ISSUER 或 APPLE_KEYCHAIN_PROFILE。
#   开了签名但缺公证凭据时 fail-closed（签名未公证的 DMG 会被 Gatekeeper 拦截，比无签名更糟）。
# relay job 同时打包手机远控中转服务两种部署产物（服务器直连 / Cloudflare 边缘，spec §20）并入 Release。
on:
  push:
    tags:
      - "v*.*.*"
  # 手动触发（配额内可用）：出包工作流选对应 v* tag 作为 ref 运行，
  # GITHUB_REF_NAME 语义与 tag push 完全一致，release job 无需区分触发方式。
  # mac-only=true：仅 mac 双架构构建（验证签名&公证链路），跳过 relay/release/publish。
  workflow_dispatch:
    inputs:
      mac-only:
        description: "仅构建 mac 双架构（签名&公证链路验证）"
        type: boolean
        default: false

      source-run-id:
        description: "恢复原始构建 run ID（不重新编译或提交已有公证）"
        type: string
        default: ""
      release-tag:
        description: "恢复时的原版本 tag，例如 v1.1.3；正常 tag 构建留空"
        type: string
        default: ""
      additional-notary-id:
        description: "人工已上传的同包补充公证 ID（只导入，不重新上传）"
        type: string
        default: ""
      additional-notary-arch:
        description: "补充公证 ID 对应的原包架构"
        type: choice
        options: [arm64, x64]
        default: arm64
      publish-feed-only:
        description: "仅补发更新feed，跳过构建、公证与GitHub Release上传"
        type: boolean
        default: false
      verified-mac-run-id:
        description: "仅补feed时，保存两份已验收Mac installers的run ID"
        type: string
        default: ""

concurrency:
  group: desktop-release-${{ inputs.release-tag || github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  identity:
    name: validate release identity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      source: ${{ steps.identity.outputs.source }}
      tag: ${{ steps.identity.outputs.tag }}
    steps:
      - name: Resolve release identity
        id: identity
        env:
          SOURCE: ${{ inputs.source-run-id || github.run_id }}
          TAG: ${{ inputs.release-tag || github.ref_name }}
          ADDITIONAL_NOTARY_ID: ${{ inputs.additional-notary-id }}
          RECOVERY_SOURCE: ${{ inputs.source-run-id }}
          FEED_ONLY: ${{ inputs.publish-feed-only }}
          VERIFIED_MAC_RUN_ID: ${{ inputs.verified-mac-run-id }}
        run: |
          if [ "$FEED_ONLY" = "true" ]; then
            [[ -n "$RECOVERY_SOURCE" && "$VERIFIED_MAC_RUN_ID" =~ ^[0-9]+$ ]] || exit 1
          fi
          if [ -n "$ADDITIONAL_NOTARY_ID" ]; then
            [[ -n "$RECOVERY_SOURCE" && "$ADDITIONAL_NOTARY_ID" =~ ^[a-fA-F0-9]{8}(-[a-fA-F0-9]{4}){3}-[a-fA-F0-9]{12}$ ]] || exit 1
          fi
          [[ "$SOURCE" =~ ^[0-9]+$ ]] || exit 1
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "正式构建或恢复必须指定版本 tag"; exit 1; }
          echo "source=$SOURCE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    needs: identity
    if: ${{ !inputs.source-run-id }}
    name: bundle ${{ matrix.target }}-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      # mac-only 验证跑法：矩阵整体切换为仅 mac 双架构（exclude 不支持表达式过滤）。
      matrix: ${{ inputs.mac-only && fromJSON('{"include":[{"runner":"macos-latest","target":"mac","arch":"arm64"},{"runner":"macos-latest","target":"mac","arch":"x64"}]}') || fromJSON('{"include":[{"runner":"macos-latest","target":"mac","arch":"arm64"},{"runner":"macos-latest","target":"mac","arch":"x64"},{"runner":"windows-latest","target":"win","arch":"x64"},{"runner":"windows-latest","target":"win","arch":"arm64"},{"runner":"ubuntu-latest","target":"linux","arch":"x64"}]}') }}
    env:
      # 正式包身份（production flavor）；跳过开发态 mock-cdn 离线缓存，打包态不依赖。
      MIKIKO_ENV: production
      MIKIKO_SKIP_REMOTE_ASSETS: "1"
      HUSKY: "0"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install Linux packaging tools
        # rpm/deb/pacman 目标依赖 rpmbuild、zstd 与 bsdtar（libarchive-tools）。
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm zstd libarchive-tools

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Prepare macOS signing identity
        # 证书未配置时跳过（保持无证书模式）；配置了则导入临时 keychain 并打开签名开关。
        # MIKIKO_ENABLE_MAC_SIGN / APPLE_SIGNING_IDENTITY 写入 GITHUB_ENV，bundle 步骤直接消费。
        if: runner.os == 'macOS'
        env:
          MAC_SIGNING_P12_BASE64: ${{ secrets.MAC_SIGNING_P12_BASE64 }}
          MAC_SIGNING_P12_PASSWORD: ${{ secrets.MAC_SIGNING_P12_PASSWORD }}
          MAC_SIGNING_IDENTITY: ${{ secrets.MAC_SIGNING_IDENTITY }}
        run: |
          if [ -z "$MAC_SIGNING_P12_BASE64" ]; then
            echo "::notice::secrets.MAC_SIGNING_P12_BASE64 未配置，Mac 走无证书模式"
            exit 0
          fi
          KEYCHAIN=build-mac-sign.keychain-db
          security create-keychain -p "" "$KEYCHAIN"
          # 默认 300 秒锁定早于首次 codesign（日志为 341~504 秒），会等待无头 runner 的解锁交互。
          # 让钥匙链在整个 150 分钟 job 中保持可用，而不是继续增加打包超时。
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security default-keychain -s "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          printf '%s' "$MAC_SIGNING_P12_BASE64" | base64 --decode > /tmp/mac-sign.p12
          security import /tmp/mac-sign.p12 -k "$KEYCHAIN" -P "$MAC_SIGNING_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -k "" "$KEYCHAIN" > /dev/null
          security show-keychain-info "$KEYCHAIN"
          rm -f /tmp/mac-sign.p12
          echo "APPLE_SIGNING_IDENTITY=$MAC_SIGNING_IDENTITY" >> "$GITHUB_ENV"
          echo "MIKIKO_ENABLE_MAC_SIGN=1" >> "$GITHUB_ENV"
          echo "CSC_KEYCHAIN=$HOME/Library/Keychains/$KEYCHAIN" >> "$GITHUB_ENV"

      - name: Bundle desktop installers
        timeout-minutes: ${{ matrix.target == 'mac' && 35 || 150 }}
        env:
          DEBUG: "electron-osx-sign*"
        run: pnpm bundle:desktop -- --os ${{ matrix.target }} --arch ${{ matrix.arch }}

      - name: Archive original signed macOS bundle
        if: runner.os == 'macOS'
        env:
          NOTARY_ARCH: ${{ matrix.arch }}
        run: |
          test "$MIKIKO_ENABLE_MAC_SIGN" = "1" || { echo "正式 Mac 发布要求签名配置"; exit 1; }
          # dmg-builder 未启用 dmg.sign 时不会签镜像；必须在记录不可变哈希前补齐 DMG 签名。
          for dmg in packages/desktop/dist/*.dmg; do
            codesign --force --sign "$APPLE_SIGNING_IDENTITY" --keychain "$CSC_KEYCHAIN" --timestamp "$dmg"
            codesign --verify "$dmg"
          done
          node packages/desktop/scripts/macos-notarization.mjs prepare packages/desktop/dist
          COPYFILE_DISABLE=1 tar -czf "signed-mac-${NOTARY_ARCH}.tar.gz" -C packages/desktop/dist .

      - name: Save original signed macOS bundle before notarization
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: signed-mac-${{ matrix.arch }}
          path: signed-mac-${{ matrix.arch }}.tar.gz
          retention-days: 30
          if-no-files-found: error
          overwrite: true

      - name: Diagnose macOS signing failure
        if: failure() && runner.os == 'macOS'
        run: |
          if [ -n "${CSC_KEYCHAIN:-}" ]; then
            security show-keychain-info "$CSC_KEYCHAIN" || true
          fi
          for pid in $(pgrep -x codesign || true); do
            sample "$pid" 2 -file "$RUNNER_TEMP/codesign-$pid.sample.txt" || true
          done

      - name: Upload macOS signing diagnostics
        if: failure() && runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: signing-diagnostics-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/codesign-*.sample.txt
            packages/desktop/dist/builder-debug.yml
          if-no-files-found: ignore
          retention-days: 30

      - name: Cleanup macOS signing keychain
        if: always() && runner.os == 'macOS'
        run: |
          security default-keychain -s ~/Library/Keychains/login.keychain-db || true
          security delete-keychain build-mac-sign.keychain-db || true

      - name: Upload installers
        if: runner.os != 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ matrix.target }}-${{ matrix.arch }}
          # 只上传安装包本体；blockmap 已随无证书注入删除或随更新屏蔽无消费方，unpacked 目录不分发。
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.exe
            packages/desktop/dist/*.AppImage
            packages/desktop/dist/*.deb
            packages/desktop/dist/*.rpm
            packages/desktop/dist/*.pkg.tar.zst
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/latest*.yml
          if-no-files-found: error
          retention-days: 30
          overwrite: true

  notarize:
    name: notarize mac-${{ matrix.arch }}
    needs: [identity, build]
    if: ${{ always() && !inputs.publish-feed-only && needs.identity.result == 'success' && (needs.build.result == 'success' || (inputs.source-run-id && needs.build.result == 'skipped')) }}
    runs-on: macos-latest
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        arch: [arm64, x64]
    env:
      SOURCE_RUN_ID: ${{ needs.identity.outputs.source }}
      RELEASE_TAG: ${{ needs.identity.outputs.tag }}
      NOTARY_ARCH: ${{ matrix.arch }}
      GH_TOKEN: ${{ github.token }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Install post-processing dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate original build identity
        id: source
        run: node .github/scripts/release-artifacts.mjs validate "$SOURCE_RUN_ID"
      - name: Download original signed bundle
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: ${{ needs.identity.outputs.source }}
          name: signed-mac-${{ matrix.arch }}
          path: original-bundle
      - name: Restore original signed bundle and latest submission state
        run: |
          mkdir -p packages/desktop/dist
          tar -xzf "original-bundle/signed-mac-${NOTARY_ARCH}.tar.gz" -C packages/desktop/dist
          node .github/scripts/release-artifacts.mjs restore-state "$SOURCE_RUN_ID" "$NOTARY_ARCH" notary-state
          if [ -n "$APPLE_API_KEY_BASE64" ]; then
            printf '%s' "$APPLE_API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-api.p8"
            echo "APPLE_API_KEY_PATH=$RUNNER_TEMP/notary-api.p8" >> "$GITHUB_ENV"
          fi
      - name: Prepare upload intent
        id: intent
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: node packages/desktop/scripts/macos-notarization.mjs intent packages/desktop/dist notary-state
      - name: Persist upload intent before contacting Apple
        uses: actions/upload-artifact@v4
        with:
          name: notary-state-${{ needs.identity.outputs.source }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}-intent
          path: notary-state/
          retention-days: 30
          if-no-files-found: error
          overwrite: true
      - name: Submit once or recover existing submission
        id: submit
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          ALLOW_NEW_SUBMISSION: ${{ steps.intent.outputs.fresh }}
        run: node packages/desktop/scripts/macos-notarization.mjs submit packages/desktop/dist notary-state
      - name: Adopt additional same-package submission
        if: inputs.additional-notary-id != '' && matrix.arch == inputs.additional-notary-arch
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          ADDITIONAL_NOTARY_ID: ${{ inputs.additional-notary-id }}
        run: node packages/desktop/scripts/macos-notarization.mjs adopt packages/desktop/dist notary-state
      - name: Persist submission immediately before waiting
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notary-state-${{ needs.identity.outputs.source }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}-submitted
          path: notary-state/
          retention-days: 30
          if-no-files-found: ignore
          overwrite: true
      - name: Wait on existing submission for at most 20 minutes
        id: wait
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: node packages/desktop/scripts/macos-notarization.mjs wait packages/desktop/dist notary-state
      - name: Persist result for another runner
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: notary-state-${{ needs.identity.outputs.source }}-${{ matrix.arch }}-${{ github.run_id }}-${{ github.run_attempt }}-waited
          path: notary-state/
          retention-days: 30
          if-no-files-found: ignore
          overwrite: true
      - name: Finalize and verify DMG and ZIP
        if: steps.wait.outputs.ready == 'true'
        env:
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
        run: node packages/desktop/scripts/macos-notarization.mjs finalize packages/desktop/dist notary-state
      - name: Require notarization Accepted
        if: steps.wait.outputs.ready != 'true'
        run: |
          echo "Apple 尚未 Accepted 或查询失败。恢复原始 run $SOURCE_RUN_ID，切勿重新构建/提交。"
          echo "gh workflow run release-desktop.yml --ref custom_main -f source-run-id=$SOURCE_RUN_ID -f release-tag=$RELEASE_TAG"
          exit 1
      - name: Upload verified installers
        uses: actions/upload-artifact@v4
        with:
          name: installers-mac-${{ matrix.arch }}
          path: |
            packages/desktop/dist/*.dmg
            packages/desktop/dist/*.zip
            packages/desktop/dist/*.blockmap
            packages/desktop/dist/latest-mac.yml
            packages/desktop/dist/release-verification.json
          retention-days: 30
          if-no-files-found: error
          overwrite: true

  source-server:
    needs: identity
    if: ${{ !inputs.mac-only && !inputs.source-run-id }}
    name: stage Source Server release
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      MIKIKO_ENV: production
      MIKIKO_SKIP_REMOTE_ASSETS: "1"
      HUSKY: "0"
      RELEASE_TAG: ${{ needs.identity.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build provider model metadata
        run: pnpm --filter @zcode/model-option-map build
      - name: Stage all four Source Server targets
        # 复用既有唯一 owner：完整 POSIX target 集合、Agent/Office 构建、组件归档和 descriptor。
        run: pnpm prepare:remote-assets
      - name: Preserve original Source Server build identity
        run: |
          node --input-type=module <<'JS'
          import { copyFile, cp, mkdir, readFile, writeFile } from 'node:fs/promises';
          const { version } = JSON.parse(await readFile('package.json', 'utf8'));
          if (`v${version}` !== process.env.RELEASE_TAG) throw new Error('Source Server tag/version mismatch');
          const source = `packages/desktop/mock-cdn/releases/${version}`;
          const destination = 'source-server-release';
          const descriptor = JSON.parse(await readFile(`${source}/source-server-release.json`, 'utf8'));
          await mkdir(destination, { recursive: true });
          for (const name of ['source-server-release.json', ...descriptor.archives.map(archive => archive.fileName)]) {
            await copyFile(`${source}/${name}`, `${destination}/${name}`);
          }
          await cp('packages/zcode-server-cli/dist-release/components', `${destination}/components`, { recursive: true });
          await writeFile(`${destination}/source-server-build.json`, JSON.stringify({
            schemaVersion: 1, version, sourceRunId: process.env.GITHUB_RUN_ID,
            commit: process.env.GITHUB_SHA, tag: process.env.RELEASE_TAG,
          }));
          JS
          node --import tsx scripts/publish-source-server-release.mjs --verify-only \
            --dist source-server-release --version "${RELEASE_TAG#v}" \
            --source-run-id "$GITHUB_RUN_ID" --commit "$GITHUB_SHA" --tag "$RELEASE_TAG"
      - name: Save original Source Server release
        uses: actions/upload-artifact@v4
        with:
          name: source-server-release
          path: source-server-release/
          retention-days: 30
          if-no-files-found: error
          overwrite: true

  relay:
    needs: identity
    if: ${{ !inputs.mac-only && !inputs.source-run-id }}
    name: package relay deploy kits
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      HUSKY: "0"
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build relay bundle
        run: pnpm --filter @zcode/relay-server run build:bundle

      - name: Build phone UI (Pages, domain-agnostic)
        # 不注入 VITE_MIKIKO_WEB_REMOTE_CONTROL_RELAY_WS_URL：运行时经票据 ws 参数定位 relay（spec §5.3）。
        run: pnpm --filter @zcode/web run build:remote-pages

      - name: Assemble server-mode kit
        run: |
          root=packages/relay-server
          stage=relay-artifacts/server
          mkdir -p "$stage/docs"
          cp "$root/dist/relay.cjs" "$stage/"
          cp "$root/deploy/relay.env.direct.example" "$stage/relay.env.example"
          cp "$root/deploy/mikiko-relay.service" "$root/deploy/Caddyfile.example" "$stage/"
          cp "$root/docs/deploy-server.md" "$stage/docs/"
          cp -R packages/web/dist-pages "$stage/web"

      - name: Assemble cloudflare-mode kit
        run: |
          root=packages/relay-server
          stage=relay-artifacts/cloudflare
          mkdir -p "$stage/docs"
          cp "$root/dist/relay.cjs" "$stage/"
          cp "$root/deploy/relay.env.cloudflare.example" "$stage/relay.env.example"
          cp "$root/deploy/mikiko-relay.service" "$root/deploy/mikiko-tunnel.service" "$stage/"
          cp "$root/deploy/deploy-pages.sh" "$stage/"
          cp "$root/docs/deploy-cloudflare.md" "$stage/docs/"
          cp -R packages/web/dist-pages "$stage/web"

      - name: Upload server-mode kit
        uses: actions/upload-artifact@v4
        with:
          name: relay-server-deploy
          path: relay-artifacts/server/
          if-no-files-found: error
          retention-days: 30

      - name: Upload cloudflare-mode kit
        uses: actions/upload-artifact@v4
        with:
          name: relay-cloudflare-deploy
          path: relay-artifacts/cloudflare/
          if-no-files-found: error
          retention-days: 30

  publish-source-server:
    if: ${{ always() && !inputs.publish-feed-only && !inputs.mac-only && needs.identity.result == 'success' && needs.notarize.result == 'success' && (needs.relay.result == 'success' || (inputs.source-run-id && needs.relay.result == 'skipped')) && (needs.source-server.result == 'success' || (inputs.source-run-id && needs.source-server.result == 'skipped')) }}
    name: publish Source Server (R2)
    needs: [identity, build, source-server, relay, notarize]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm
      - name: Install publishing dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Restore and validate original Source Server artifact
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
          SOURCE_RUN_ID: ${{ needs.identity.outputs.source }}
        run: node .github/scripts/release-artifacts.mjs download-source-server "$SOURCE_RUN_ID" unused source-server-release
      - name: Publish verified Source Server objects and indexes
        if: steps.source.outputs.available == 'true'
        env:
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
          SOURCE_RUN_ID: ${{ needs.identity.outputs.source }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          UPDATE_PUBLISH_TOKEN: ${{ secrets.UPDATE_PUBLISH_TOKEN }}
        run: |
          node --import tsx scripts/publish-source-server-release.mjs \
            --dist source-server-release --version "${RELEASE_TAG#v}" \
            --source-run-id "$SOURCE_RUN_ID" --commit "$SOURCE_COMMIT" --tag "$RELEASE_TAG"

  release:
    if: ${{ always() && !inputs.publish-feed-only && !inputs.mac-only && needs.identity.result == 'success' && needs.notarize.result == 'success' && needs.publish-source-server.result == 'success' && (needs.relay.result == 'success' || (inputs.source-run-id && needs.relay.result == 'skipped')) }}
    name: publish release
    needs: [identity, build, source-server, relay, notarize, publish-source-server]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out (full history for release notes)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download original platform kits and verified Mac installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
          MAC_RUN_ID: ${{ github.run_id }}
          SOURCE_RUN_ID: ${{ needs.identity.outputs.source }}
        run: node .github/scripts/release-artifacts.mjs download-release "$SOURCE_RUN_ID" unused artifacts

      - name: Restore original Source Server release assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
          SOURCE_RUN_ID: ${{ needs.identity.outputs.source }}
        run: node .github/scripts/release-artifacts.mjs download-source-server "$SOURCE_RUN_ID" unused artifacts/source-server-release

      - name: Assemble release assets
        run: |
          mkdir -p release-assets
          for dir in artifacts/installers-*; do
            find "$dir" -maxdepth 1 -type f ! -name 'release-verification.json' -exec cp {} release-assets/ \;
          done
          for arch in arm64 x64; do
            cp "artifacts/installers-mac-$arch/release-verification.json" "release-assets/notarization-mac-$arch.json"
          done
          for kit in relay-server-deploy relay-cloudflare-deploy; do
            (cd "artifacts/$kit" && zip -r "../../release-assets/$kit.zip" .)
          done
          if [ -d artifacts/source-server-release ]; then
            cp artifacts/source-server-release/mikiko-server-*.tar.gz release-assets/
            cp artifacts/source-server-release/source-server-release.json release-assets/
            cp artifacts/source-server-release/source-server-build.json release-assets/
          fi

      - name: Generate release notes
        env:
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
          MIKIKO_RELEASE_NOTARIZED: "1"
        run: |
          node .github/scripts/generate-release-notes.mjs "$RELEASE_TAG" > release-notes.md
          cat release-notes.md

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        run: |
          # 上传中断后只重传资产，不删除已有 Release 或移动 tag。
          if ! gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --draft --title "${RELEASE_TAG#v}" --notes-file release-notes.md
          fi
          gh release upload "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --clobber release-assets/*
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --draft=false --notes-file release-notes.md

  publish-update-feed:
    # 恢复正常跳过 build/relay；显式状态检查避免默认 success() 传播 skipped，导致 feed 未发布。
    if: ${{ always() && !inputs.mac-only && needs.identity.result == 'success' && (needs.release.result == 'success' || (inputs.publish-feed-only && needs.release.result == 'skipped')) }}
    name: publish update feed (R2)
    needs: [identity, release]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0

      - name: Download verified installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
          MAC_RUN_ID: ${{ inputs.publish-feed-only && inputs.verified-mac-run-id || github.run_id }}
          SOURCE_RUN_ID: ${{ needs.identity.outputs.source }}
        run: node .github/scripts/release-artifacts.mjs download-release "$SOURCE_RUN_ID" unused packages/desktop/dist

      - name: Archive source feed manifests for acceptance
        uses: actions/upload-artifact@v4
        with:
          name: feed-source-manifests
          path: packages/desktop/dist/installers-*/*.yml
          if-no-files-found: error
          retention-days: 30
          overwrite: true

      - name: Export release notes
        # 更新日志与 GitHub Release 正文同源（release job 先行生成）；注入 latest*.yml 的
        # releaseNotesByLocale，客户端「发现更新」弹窗与安装后说明展示自建日志。
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" --json body -q .body > release-notes.md
          echo "release notes: $(wc -c < release-notes.md) bytes"

      - name: Publish manifests and installers
        env:
          RELEASE_TAG: ${{ needs.identity.outputs.tag }}
          UPDATE_PUBLISH_TOKEN: ${{ secrets.UPDATE_PUBLISH_TOKEN }}
          # 与 Worker 侧 wrangler secret 同名（MIKIKO_RELEASE_PUBLISH_TOKEN），避免两套名字。
          MIKIKO_RELEASE_PUBLISH_TOKEN: ${{ secrets.MIKIKO_RELEASE_PUBLISH_TOKEN }}
        run: |
          if [ -z "$UPDATE_PUBLISH_TOKEN" ]; then
            echo "::notice::secrets.UPDATE_PUBLISH_TOKEN 未配置，跳过升级 feed 发布（版本仍可在 GitHub Release 下载）"
            exit 78
          fi
          node scripts/publish-update-feed.mjs \
            --dist packages/desktop/dist --version "${RELEASE_TAG#v}" --channel stable \
            --release-notes release-notes.md
