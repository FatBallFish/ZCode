name: Deploy Remote Control

# 远控三端自动部署（spec §22）：push 到 main 且中继/手机页/共享协议有变更时触发。
# - relay：构建单文件 bundle → SSH 部署到 VPS 并重启 systemd（需 secret RELAY_DEPLOY_KEY，
#   其公钥已加入服务器 authorized_keys）。
# - 手机页：构建域名无关 Pages 产物 → wrangler 发布（需 secret CLOUDFLARE_API_TOKEN）。
# 任一 secret 未配置时对应 job 主动跳过（exit 78），不阻塞另一个。

# 触发与发版对齐（2026-09-24 修订）：push 分支不触发——custom_main 高频提交且可能领先于
# tag，会造成三端部署内容与已发布版本不一致。改为打 v* tag 触发（与 release-desktop.yml
# 同节奏），保证每次部署的都是一次确定要发布的版本；支持手动 dispatch 兜底。
on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:

concurrency:
  group: deploy-remote-control
  cancel-in-progress: false

env:
  HUSKY: "0"
  RELAY_HOST: 152.53.168.164
  RELAY_USER: root
  RELAY_PATH: /srv/mikiko-remote/relay.cjs

jobs:
  relay:
    name: deploy relay (VPS)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build relay bundle
        run: pnpm --filter @zcode/relay-server run build:bundle

      - name: Deploy over SSH
        env:
          RELAY_DEPLOY_KEY: ${{ secrets.RELAY_DEPLOY_KEY }}
        run: |
          if [ -z "$RELAY_DEPLOY_KEY" ]; then
            echo "::notice::secrets.RELAY_DEPLOY_KEY 未配置，跳过中继部署（本地开发时可先手动部署）"
            exit 78
          fi
          mkdir -p ~/.ssh
          # 规范化常见粘贴损坏：首尾引号/CR/字面 \n，并确保末尾换行。
          printf '%s' "$RELAY_DEPLOY_KEY" \
            | sed -e 's/^"//' -e 's/"$//' -e $'s/\r//' -e 's/\\n/\n/g' > ~/.ssh/relay_key
          echo >> ~/.ssh/relay_key
          chmod 600 ~/.ssh/relay_key
          # 私钥自检：无法解析 = 粘贴损坏；指纹不符 = 配错钥匙（指纹是公开信息，可安全打印比对）。
          if ! EXPECTED_PUB=$(ssh-keygen -y -f ~/.ssh/relay_key 2>/dev/null); then
            echo "::error::私钥无法解析（粘贴损坏或为带口令密钥）。请用无口令的部署私钥重新配置 secrets.RELAY_DEPLOY_KEY"
            exit 1
          fi
          ACTUAL_FP=$(ssh-keygen -lf ~/.ssh/relay_key | awk '{print $2}')
          echo "CI 密钥指纹: $ACTUAL_FP"
          EXPECTED_FP="SHA256:/jSkBYf5v8uACkfTtgsTTNRb42fyQIhyhpKBOdyV5MY"
          if [ "$ACTUAL_FP" != "$EXPECTED_FP" ]; then
            echo "::error::密钥指纹与服务器登记的部署钥不一致（期望 $EXPECTED_FP）。secrets.RELAY_DEPLOY_KEY 应为 ~/.ssh/id_ed25519_relay_ci 的私钥内容"
            exit 1
          fi
          ssh-keyscan -H "$RELAY_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          scp -i ~/.ssh/relay_key packages/relay-server/dist/relay.cjs "$RELAY_USER@$RELAY_HOST:$RELAY_PATH"
          ssh -i ~/.ssh/relay_key "$RELAY_USER@$RELAY_HOST" "systemctl restart mikiko-relay && sleep 1 && systemctl is-active mikiko-relay"

  pages:
    name: deploy phone page (Pages)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build phone UI (domain-agnostic)
        run: pnpm --filter @zcode/web run build:remote-pages

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::secrets.CLOUDFLARE_API_TOKEN 未配置，跳过手机页部署"
            exit 78
          fi
          # hidden source map仍是实体文件；25.1MiB map会超过Pages单文件限制，上传只保留运行时资源。
          find packages/web/dist-pages -type f -name '*.map' -delete
          npx --yes wrangler@4 pages deploy packages/web/dist-pages \
            --project-name mikiko-remote --branch main

  update-service:
    name: deploy update worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24.14.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Test update downloads against local R2
        run: node scripts/run-isolated-tests.mjs pnpm --filter @zcode/update-service test

      - name: Deploy Worker
        working-directory: packages/update-service
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::notice::secrets.CLOUDFLARE_API_TOKEN 未配置，跳过升级服务部署"
            exit 78
          fi
          pnpm exec wrangler deploy

      - name: Verify public download range
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { setTimeout } from 'node:timers/promises';
          const endpoint = new URL('https://agent-update.mikiko.ai/api/v1/releases/electron/manifest');
          endpoint.searchParams.set('platform', 'darwin-aarch64');
          endpoint.searchParams.set('channel', '1');
          const manifest = await fetch(endpoint, { signal: AbortSignal.timeout(30_000) });
          assert.equal(manifest.status, 200);
          const text = await manifest.text();
          const path = /^path:\s*(['"]?)(.+?)\1\s*$/m.exec(text)?.[2];
          assert.ok(path, 'Stable manifest must identify an actual installer');
          const version = /^version:\s*(['"]?)([0-9]+\.[0-9]+\.[0-9]+)\1\s*$/m.exec(text)?.[2];
          assert.ok(version, 'Stable manifest must identify its version');
          // manifest.path是版本目录内文件名；域根目录解析会把正常下载错误判为404。
          const download = new URL(path, `https://agent-dl.mikiko.ai/files/${version}/`);
          assert.equal(download.origin, 'https://agent-dl.mikiko.ai');
          download.searchParams.set('verify-deployment', process.env.GITHUB_SHA);
          for (let attempt = 0; attempt < 12; attempt++) {
            try {
              const response = await fetch(download, { headers: { Range: 'bytes=0-31' }, signal: AbortSignal.timeout(30_000) });
              const bytes = new Uint8Array(await response.arrayBuffer());
              assert.equal(response.status, 206);
              assert.match(response.headers.get('content-range') ?? '', /^bytes 0-31\/[0-9]+$/);
              assert.equal(response.headers.get('content-length'), '32');
              assert.equal(bytes.length, 32);
              console.log('Public installer range verified: 32 bytes with matching headers');
              break;
            } catch (error) {
              if (attempt === 11) throw error;
              console.log(`Waiting for deployed range response (${attempt + 1}/12)`);
              await setTimeout(5_000);
            }
          }
          JS

# trigger: verify-deploy-key
